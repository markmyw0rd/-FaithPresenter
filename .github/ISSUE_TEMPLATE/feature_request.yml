name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Operator problem
      description: What problem occurs during service preparation or presentation?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    attributes:
      label: Safety and output impact
      description: Explain any effect on Preview, Audience, Stage, Stream or saved data.
